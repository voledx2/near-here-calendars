name: Nightly calendar build

# Rebuilds the Near Here calendars from the team's Google Sheet every night,
# and can also be run by hand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC every night (02:17 UK winter time, 03:17 summer time)
  workflow_dispatch:

permissions:
  contents: write

env:
  # The Timetable Sheet, published to the web as .xlsx (File > Share > Publish to web)
  SHEET_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vSVsouWCX2YCwUxwQjjxyAM7eI428oDVI2imTMc2-zoJWCmVvDiDTaU90NijHxclnphzMMW0HlQVin4/pub?output=xlsx

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install openpyxl
        run: pip install openpyxl==3.1.5

      - name: Build calendars from the sheet
        run: python builder.py "$SHEET_URL" .

      - name: Publish changes
        run: |
          git config user.name "near-here-builder"
          git config user.email "near-here-builder@users.noreply.github.com"
          git add -A feeds index.html problems.html problems.csv build_report.txt
          if git diff --cached --quiet; then
            echo "No changes tonight."
          else
            git commit -m "Nightly build $(date -u +%F)"
            git push
          fi
